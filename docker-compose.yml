version: '3.8'

services:
  crawler-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crawler-system-backend
    restart: unless-stopped
    ports:
      - "${FLASK_PORT:-5000}:5000"
    environment:
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - MAX_WORKERS=${MAX_WORKERS:-4}
      - TASK_TIMEOUT=${TASK_TIMEOUT:-300}
    volumes:
      - crawler-uploads:/app/uploads
      - crawler-results:/app/results
      - crawler-logs:/app/logs
      - ./backend/tasks.json:/app/tasks.json
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - crawler-network

  # 可选：添加前端服务（用于本地开发或不使用 GitHub Pages 的情况）
  crawler-frontend:
    image: nginx:alpine
    container_name: crawler-system-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - crawler-backend
    networks:
      - crawler-network
    profiles:
      - with-frontend

volumes:
  crawler-uploads:
  crawler-results:
  crawler-logs:

networks:
  crawler-network:
    driver: bridge
